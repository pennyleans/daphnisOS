<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="geometricPrecision" role="img" aria-label="Daphnis Miniature Color Mark (Open Cut Bauhaus, No Wordmark)">
  <defs>
    <clipPath id="mini-tri-xor">
      <polygon points="4,26 13,26 7.5,17" />
    </clipPath>
  </defs>
  <!-- Top-Left Counterweight Bar & Yellow Shepherd Moon -->
  <rect x="6" y="2" width="10" height="3" fill="#141413" />
  <circle cx="9" cy="8" r="2.2" fill="#E5A900" />
  <!-- 1. Blue Left Semicircle / Circle (cx=16, cy=15.5, r=10.5) -->
  <circle cx="16" cy="15.5" r="10.5" fill="#1A4B8C" />
  <!-- 2. Red Ascender Block (x=16..27, y=2..26) -->
  <rect x="16" y="2" width="11" height="24" fill="#D62828" />
  <!-- XOR Negative-Space Semicircle on Right -->
  <path d="M 16 5 A 10.5 10.5 0 0 1 16 26 Z" fill="#F3EFE6" />
  <!-- Inner Left Semicircle of Counter (Carbon Ink) -->
  <path d="M 16 9.8 A 5.7 5.7 0 0 0 16 21.2 Z" fill="#141413" />
  <!-- 3. Skewed Yellow Triangle Chock -->
  <polygon points="4,26 13,26 7.5,17" fill="#E5A900" />
  <!-- True XOR Intersection: Where Yellow Triangle and Blue Circle overlap -->
  <circle cx="16" cy="15.5" r="10.5" fill="#F3EFE6" clip-path="url(#mini-tri-xor)" />
  <!-- Centered Datum Ground Rule (No wordmark below) -->
  <rect x="4" y="28" width="23" height="2" fill="#141413" />
</svg>
